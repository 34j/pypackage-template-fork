name: CI

on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: ${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  ci:
    uses: 34j/.github/.github/workflows/python-package-ci.yml@main
    permissions:
      attestations: write
      contents: write
      id-token: write
