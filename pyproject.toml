[build-system]
build-backend = "setuptools.build_meta"
requires = [ "setuptools>=77.0.3" ]

[project]
name = "pypackage-template"
version = "0.1.0"
description = "A template for generating a Python package"
license = "MIT"
authors = [ { name = "34j" } ]
requires-python = ">=3.12"
classifiers = [
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
]
dependencies = []

[dependency-groups]
dev = [
  "copier==9.*",
  "packaging-34j[test]",
  "pytest==9.*",
  "pytest-mock",
]

[tool.ruff]
extend = ".venv/lib/python3.13/site-packages/packaging_34j/ruff.toml"
lint.extend-per-file-ignores."project/**/*.py" = [ "INP001", "N999" ]

[tool.pyproject-fmt]
max_supported_python = "3.14"

[tool.pytest]
ini_options.testpaths = "tests/"
ini_options.addopts = "-v -Wdefault"
